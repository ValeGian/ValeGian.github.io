name: Data

on:
  push:
    branches: [master]
    # Everything the steps below read. The code and its tests are here because the unit
    # tests cover them: without these, a code-only push was never tested, and a failure
    # only showed up on the next data push, where it also stopped validation running.
    paths:
      - 'schemas/**'
      - 'scripts/**'
      - 'public/data/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/data.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schema tests
        run: npm run test:schemas

      # Builds its own throwaway vault, so CI proves the isolation property without ever
      # holding a real password or a real file.
      - name: Encryption tests
        run: npm run test:crypto

      - name: Unit tests
        run: npm test
      # Personal files live under .local/ and are absent here by design; the script
      # checks what exists and requires only the public files.
      - name: Validate data files
        run: npm run validate
