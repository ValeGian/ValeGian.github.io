name: Deploy site

on:
  push:
    branches: [master]
  # A push made with GITHUB_TOKEN does not trigger other workflows, so the nightly price
  # commit would never reach the site. Deploy when that workflow finishes instead.
  workflow_run:
    workflows: [Prices]
    types: [completed]
  workflow_dispatch:

# Least privilege: the build reads the repo, the deploy publishes to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a half-finished publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
